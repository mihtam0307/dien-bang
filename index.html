<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Điền bảng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfcff;--grid:#dde7f7;--ink:#1c2433;--blue:#1d3fa8;--onblue:#fff;--mu:#5d6b85;--red:#d9453f;--hl:#ffe98a;--ok:#13795b;--er:#c0392b;--line:#b8c7e3;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--paper:#111827;--grid:#1b2640;--ink:#e9eefb;--blue:#9db8ff;--onblue:#0f1a3a;--mu:#97a3bd;--red:#ff7a73;--hl:#5a4d12;--ok:#45d4a1;--er:#ff8a7c;--line:#2e3b5a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background-color:var(--paper);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
 padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 120px)}
main{position:relative;max-width:560px;margin:0 auto;padding-left:20px}
main::before{content:"";position:absolute;left:0;top:-24px;bottom:-120px;width:2px;background:var(--red);opacity:.75}
.ds{margin:0 0 14px;font-size:13px;color:var(--mu)}
.ds.e{color:var(--er)}
h1{margin:0 0 6px;font-size:36px;line-height:1.1;font-weight:800;letter-spacing:-.02em;color:var(--blue)}
.sec{padding:14px 0;border-bottom:1.5px solid var(--line)}
label,.lb{display:block;font-size:13px;color:var(--mu);margin:0 0 4px}
input[type=text],input:not([type]),textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,.sel:has(input:focus-visible) .box{outline:3px solid var(--blue);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:8px;padding:11px 16px;border:1.5px solid var(--blue);background:var(--blue);color:var(--onblue);font-weight:600}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.ghost{background:transparent;color:var(--blue)}
button.sm{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.in{display:flex;gap:8px}.in input{flex:1;min-width:0}
details summary{cursor:pointer;color:var(--mu);font-size:14px;margin-top:10px}
details>*:not(summary){margin-top:10px}
.chip{display:inline-block;margin:0 6px 6px 0;padding:5px 12px;font-size:14px;font-weight:400;border-radius:99px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.item{display:flex;align-items:center;gap:8px;border-bottom:1.5px solid var(--line)}
.sel{flex:1;display:flex;gap:14px;align-items:center;padding:14px 0;margin:0;font-size:16px;color:var(--ink);cursor:pointer;min-width:0}
.sel input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:24px;height:24px;border:2px solid var(--blue);border-radius:5px;position:relative}
.sel input:checked+.box{background:var(--blue)}
.sel input:checked+.box::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid var(--onblue);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.txt{min-width:0}
.txt b{font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.on .txt b{background:linear-gradient(transparent 52%,var(--hl) 52%)}
.txt small{display:block;color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px 0;color:var(--mu)}.empty p{margin:0 0 12px}
#log{padding-top:12px}#log div{font-size:14px;padding:3px 0}.ok{color:var(--ok)}.er{color:var(--er)}.wr{color:var(--mu)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bar #go{flex:1}
dialog{width:100%;max-width:560px;margin:auto auto 0;border:0;border-top:3px solid var(--blue);border-radius:18px 18px 0 0;background:var(--paper);color:var(--ink);padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(8,12,26,.55)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){dialog[open]{animation:none}button:active{transform:none}}
dialog h2{margin:0 0 14px;font-size:20px;font-weight:800;color:var(--blue)}
dialog input,dialog textarea{margin-bottom:12px}
textarea{resize:vertical}
.acts{display:flex;gap:8px;margin-top:6px}.acts .sp{flex:1}
button.dg{color:var(--er);border-color:var(--line)}
#live,#cmp{padding:14px 0;border-bottom:1.5px solid var(--line)}
#lt,#ct{font-weight:600}
.prog{height:10px;border-radius:99px;background:var(--grid);border:1.5px solid var(--line);overflow:hidden;margin:8px 0 12px}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mu);text-align:left;font-weight:400;padding:4px 6px;border-bottom:1.5px solid var(--blue)}
td{padding:9px 6px;border-bottom:1.5px solid var(--line);vertical-align:top}
td.no,td.rw{color:var(--mu);font-size:13px;white-space:nowrap}
td.nm{font-weight:600;overflow-wrap:anywhere}
td.nm small{display:block;font-weight:400;font-size:13px;color:var(--mu);white-space:pre-line}
td.st small{display:block;font-size:12px;font-weight:400}
td.st{white-space:nowrap;font-weight:600}
tr.shr td{background:var(--grid);font-weight:800;border-bottom-color:var(--blue)}
tr.run td{background:var(--hl)}
.s-w{color:var(--mu);font-weight:400}.s-r{color:var(--ink)}.s-o{color:var(--ok)}.s-e{color:var(--er)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:6px;animation:bl 1s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}.prog i{transition:none}}
</style></head><body>
<main>
<h1>Điền bảng</h1>
<div id="ds" class="ds" role="status" aria-live="polite"></div>

<section class="sec">
  <label for="link">Link bảng Google Sheets</label>
  <div class="in"><input id="link" placeholder="Dán link lớp trưởng gửi"><button class="ghost" id="paste">Dán</button><button class="ghost" id="rd">Đọc bảng</button></div>
  <details><summary>Cài đặt</summary>
    <div><span class="lb">Phiên bản: <b id="ver"></b> (app tự cập nhật khi mở)</span></div>
    <div><label for="url">Link Apps Script (Web app URL)</label>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div><span class="lb">Kho lưu trữ: Google Drive (file “Điền bảng - dữ liệu.json”)</span></div>
    <div><span class="lb">Thông tin cần điền (chạm để xóa, tên phải giống tên cột trong bảng)</span><div id="fl"></div></div>
  </details>
</section>

<section id="live" hidden>
  <div id="lt" role="status" aria-live="polite"></div>
  <div class="prog"><i id="pb"></i></div>
  <table><thead><tr><th>#</th><th>Họ và tên</th><th>Trạng thái</th><th>Dòng</th></tr></thead><tbody id="lv"></tbody></table>
</section>

<section id="cmp" hidden>
  <div id="ct" role="status" aria-live="polite"></div>
  <table><thead><tr><th>Họ và tên</th><th>Kết quả</th></tr></thead><tbody id="cv"></tbody></table>
</section>

<section id="list"></section>
<section id="log" role="status" aria-live="polite" hidden></section>
</main>

<div class="bar"><div>
  <button class="ghost" id="add">+ Thêm người</button>
  <button id="go">Chọn người để điền</button>
</div></div>

<dialog id="dlg"><div>
  <h2 id="dt">Thêm người</h2>
  <label for="n">Họ và tên (y như trong bảng)</label><input id="n">
  <div id="ff"></div>
  <button class="ghost sm" id="addf" style="margin-bottom:14px">+ Thêm thông tin</button>
  <label for="l">Link bảng riêng (không bắt buộc)</label><input id="l">
  <div class="acts"><button id="del" class="ghost dg">Xóa</button><span class="sp"></span>
  <button class="ghost" id="cancel">Hủy</button><button id="ok">Lưu</button></div>
</div></dialog>

<dialog id="rdlg"><div>
  <h2>Đọc bảng đã có thông tin</h2>
  <label for="rl">Dán một hoặc nhiều link Google Sheets (mỗi link một dòng)</label>
  <textarea id="rl" rows="5" placeholder="https://docs.google.com/spreadsheets/d/..."></textarea>
  <div id="rerr" class="er" role="alert"></div>
  <div class="acts"><button class="ghost sm" id="rpaste">Dán</button><span class="sp"></span>
  <button class="ghost" id="rcancel">Hủy</button><button id="rgo">Đọc và lưu</button></div>
</div></dialog>

<script>
const $=s=>document.querySelector(s);
let S={url:'',people:[],fields:['Số CCCD','Ngày cấp','Nơi cấp']},edit=-1;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('dienbang_db')||'{}'))}catch(e){}
S.people.forEach(p=>{if(!p.v)p.v={'Số CCCD':p.cccd||'','Ngày cấp':p.ngayCap||'','Nơi cấp':p.noiCap||''}});
let dTimer=0,dChain=Promise.resolve();
const API=b=>fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)}).then(r=>r.json());
function ds(t,bad){const e=$('#ds');e.textContent=t;e.className='ds'+(bad?' e':'')}
const keep=()=>{try{localStorage.setItem('dienbang_db',JSON.stringify(S))}catch(e){}};
const DEF_URL='https://script.google.com/macros/s/AKfycbznu5pmN4ndTzyz86-GCVZhysisReG8go8M92kZ-7tkltSrnab6ekP62WxKYv79K87cuQ/exec';
if(DEF_URL&&S.defUrl!==DEF_URL){S.url=DEF_URL;S.defUrl=DEF_URL;S.ts=0;keep()}
const save=()=>{S.ts=Date.now();keep();pushSoon()};
function pushSoon(){if(!S.url)return;ds('Drive: chờ lưu…');clearTimeout(dTimer);dTimer=setTimeout(pushDrive,1500)}
function pushDrive(){dChain=dChain.then(doPush);return dChain}
async function doPush(){
  if(!S.url)return false;
  ds('Drive: đang lưu…');
  try{
    const j=await API({action:'save',data:{ts:S.ts,fields:S.fields,people:S.people}});
    if(!j.ok)throw new Error(j.error||'Lỗi');
    ds('Drive: đã lưu '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}));return true;
  }catch(e){ds('Drive: lưu lỗi ('+(e.message||'mạng')+'), sẽ thử lại khi có thay đổi',1);return false}
}
async function loadDrive(){
  if(!S.url){$('details').open=true;ds('Cần dán link Apps Script vào Cài đặt để dùng app',1);return}
  ds('Drive: đang tải…');
  try{
    const j=await API({action:'load'});
    if(!j.ok)throw new Error(j.error||'Lỗi');
    const d=j.data;
    if(d&&Array.isArray(d.people)&&(d.ts||0)>(S.ts||0)){
      S.people=d.people;if(Array.isArray(d.fields)&&d.fields.length)S.fields=d.fields;S.ts=d.ts;keep();render();
      ds(`Drive: đã tải ${S.people.length} người`);
    }else if(S.people.length&&(!d||!d.people||(S.ts||0)>(d.ts||0)))pushSoon();
    else ds('Drive: đã đồng bộ');
  }catch(e){ds('Drive: chưa kết nối ('+(e.message||'mạng')+')',1)}
}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function count(){
  const n=S.people.filter(p=>p.sel).length,g=$('#go');
  g.disabled=!n;g.textContent=n?`Điền cho ${n} người`:'Chọn người để điền';
}
function render(){
  $('#url').value=S.url;
  $('#fl').innerHTML=S.fields.map((f,i)=>`<button class="chip" data-x="${i}">${esc(f)} ×</button>`).join('');
  $('#list').innerHTML=S.people.length?S.people.map((p,i)=>{
    const info=S.fields.map(f=>p.v[f]).filter(Boolean).join(', ');
    return `<div class="item ${p.sel?'on':''}"><label class="sel"><input type="checkbox" class="pick" value="${i}" ${p.sel?'checked':''}><span class="box"></span>
    <span class="txt"><b>${esc(p.name)}</b>${info?`<small>${esc(info)}</small>`:''}${p.link?'<small>Đã nhớ link bảng</small>':''}</span></label>
    <button class="ghost sm" data-e="${i}">Sửa</button></div>`}).join('')
    :'<div class="empty"><p>Chưa có ai trong danh sách.</p><button class="ghost" data-add>Thêm người đầu tiên</button></div>';
  count();
}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/\s+/g,' ').trim();
const key=v=>norm(v).replace(/\s/g,'');
const idOf=l=>(String(l||'').match(/\/d\/([\w-]+)/)||[])[1];
async function readSheet(link){
  const id=idOf(link);if(!id)throw new Error('Link bảng không đúng');
  const g=link.match(/[#&?]gid=(\d+)/);
  const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'read',sheetId:id,gid:g?g[1]:''})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Lỗi đọc bảng');
  if(!j.rows)throw new Error('Apps Script chưa cập nhật bản mới (cần Deploy lại Code.gs)');
  return j;
}
function colMap(hdr,nameCol){
  const map={};
  S.fields.forEach(f=>{const L=norm(f);
    for(let c=0;c<hdr.length;c++){if(c===nameCol)continue;const t=norm(hdr[c]);
      if(t&&L&&(t===L||t.indexOf(L)>-1||(t.length>2&&L.indexOf(t)>-1))){map[f]=c;break}}});
  return map;
}
function compare(p,rw,map){
  const diffs=[],miss=[],filled=[];
  S.fields.forEach(f=>{
    if(!(f in map))return;
    const a=String(p.v[f]||'').trim(),b=String(rw.cells[map[f]]||'').trim();
    if(!a&&!b)return;
    if(!a)filled.push({f,b});
    else if(!b)miss.push(`${f}: bảng chưa có`);
    else if(key(a)!==key(b))diffs.push(`${f}: app “${a}” ≠ bảng “${b}”`);
  });
  return{diffs,miss,filled};
}
const LB={r:['Đang đọc…','r'],a:['Đang thêm…','r'],s:['Đang lưu…','r'],w:['Chờ','w'],o:['✓ Đã đọc','o'],n:['✓ Đã thêm','o'],f:['✓ Đã lưu bổ sung','o'],k:['✓ Khớp','o'],m:['Bảng chưa có','w'],d:['⚠ Lệch','e'],e:['✗ Lỗi','e']};
let cm=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const isRun=x=>x.s==='r'||x.s==='a'||x.s==='s';
function renderCmp(msg){
  $('#ct').textContent=msg;
  $('#cv').innerHTML=cm.map(x=>`<tr class="${x.h?'shr ':''}${isRun(x)?'run':''}"><td class="nm">${esc(x.n)}${x.note?`<small>${esc(x.note)}</small>`:''}</td>
    <td class="st s-${LB[x.s][1]}">${isRun(x)?'<span class="dot"></span>':''}${LB[x.s][0]}</td></tr>`).join('');
  const r=$('#cv .run');if(r&&r.scrollIntoView)r.scrollIntoView({block:'nearest'});
}
$('#rd').onclick=()=>{$('#rerr').textContent='';$('#rl').value='';$('#rdlg').showModal()};
$('#rcancel').onclick=()=>$('#rdlg').close();
$('#rpaste').onclick=async()=>{
  try{const t=await navigator.clipboard.readText();$('#rl').value=($('#rl').value.trim()+'\n'+t).trim()}
  catch(e){$('#rerr').textContent='Không đọc được clipboard, hãy dán tay vào ô.'}
};
$('#rgo').onclick=async()=>{
  const seen=new Set();
  const links=($('#rl').value.match(/https?:\/\/[^\s]+/g)||[]).filter(l=>{
    const id=idOf(l);if(!id)return false;
    const g=l.match(/[#&?]gid=(\d+)/),k=id+'/'+(g?g[1]:'');
    if(seen.has(k))return false;seen.add(k);return true;
  });
  if(!links.length){$('#rerr').textContent='Chưa có link Google Sheets hợp lệ.';return}
  if(!S.url){$('#rerr').textContent='Chưa có link Apps Script. Mở Cài đặt để dán vào.';return}
  $('#rdlg').close();$('#log').innerHTML='';
  $('#live').hidden=true;$('#cmp').hidden=false;
  $('#rd').disabled=true;$('#go').disabled=true;
  cm=[];renderCmp(`Bắt đầu đọc ${links.length} bảng…`);
  $('#cmp').scrollIntoView({block:'start'});
  const n={n:0,f:0,k:0,d:0,m:0,skip:0,fail:0};
  for(let i=0;i<links.length;i++){
    const link=links[i],T=`bảng ${i+1}/${links.length}`;
    const sh={h:1,n:`Bảng ${i+1}`,s:'r',note:'…'+idOf(link).slice(-8)};
    cm.push(sh);renderCmp(`Đang đọc ${T}…`);
    let j,map;
    try{j=await readSheet(link);map=colMap(j.headers,j.nameCol)}
    catch(e){sh.s='e';sh.note=e.message;n.fail++;renderCmp(`Lỗi khi đọc ${T}`);continue}
    const list=[];let sk=0;
    j.rows.forEach(rw=>{
      const v={};S.fields.forEach(f=>{if(f in map){const b=String(rw.cells[map[f]]||'').trim();if(b)v[f]=b}});
      const exists=S.people.some(x=>norm(x.name)===norm(rw.name));
      if(!exists&&!Object.keys(v).length){sk++;return}
      const x={n:rw.name,s:'w'};cm.push(x);list.push({rw,v,x});
    });
    sh.s='o';sh.note=`${list.length} người${sk?`, bỏ qua ${sk} dòng trống`:''}`;
    renderCmp(`Đã đọc ${T}: ${list.length} người`);
    for(const it of list){
      const{rw,v,x}=it;
      x.s='r';renderCmp(`${T} · đang đọc: ${x.n}`);await sleep(40);
      const p0=S.people.find(q=>norm(q.name)===norm(rw.name));
      if(!p0){
        x.s='a';renderCmp(`${T} · đang thêm: ${x.n}`);await sleep(40);
        S.people.push({name:rw.name,link:'',v,sel:false});save();
        x.s='n';x.note='Đã thêm: '+Object.values(v).join(', ');n.n++;
      }else{
        const c=compare(p0,rw,map),notes=[...c.diffs,...c.miss];
        if(c.filled.length){
          x.s='s';renderCmp(`${T} · đang lưu: ${x.n}`);await sleep(40);
          c.filled.forEach(q=>p0.v[q.f]=q.b);save();
          notes.push('Lấy từ bảng: '+c.filled.map(q=>q.f).join(', '));
        }
        x.s=c.diffs.length?'d':c.filled.length?'f':c.miss.length?'m':'k';
        x.note=notes.join('\n');n[x.s]++;
      }
      renderCmp(`${T} · xong: ${x.n}`);
    }
  }
  save();render();
  renderCmp('Đang lưu lên Drive…');
  clearTimeout(dTimer);const dok=await pushDrive();
  const parts=[[n.n,'mới'],[n.f,'bổ sung'],[n.k,'khớp'],[n.d,'lệch'],[n.m,'bảng chưa có'],[n.fail,'bảng lỗi']].filter(q=>q[0]).map(q=>`${q[0]} ${q[1]}`);
  renderCmp(`Xong ${links.length-n.fail}/${links.length} bảng${parts.length?': '+parts.join(' · '):''}. ${dok?'Đã lưu lên Drive.':'Đã lưu trong máy, chưa lưu được lên Drive.'}`);
  $('#rd').disabled=false;
};

let live=[];
const ST={w:'Chờ',r:'Đang điền',o:'✓ Đã điền',e:'✗ Lỗi'};
function renderLive(finished,msg){
  const ok=live.filter(x=>x.s==='o').length,er=live.filter(x=>x.s==='e').length,done=ok+er,n=live.length;
  $('#pb').style.width=(n?done/n*100:0)+'%';
  const cur=live.find(x=>x.s==='r');
  $('#lt').textContent=msg?msg:finished?`Xong: ${ok} thành công${er?`, ${er} lỗi`:''}${live.filter(x=>x.chk==='l').length?`, ${live.filter(x=>x.chk==='l').length} lệch khi đối chiếu`:''} (${n} người)`
    :`Đã điền ${done}/${n}${cur?` · đang điền: ${cur.n}`:''}`;
  $('#lv').innerHTML=live.map((x,i)=>`<tr class="${x.s==='r'?'run':''}"><td class="no">${i+1}</td>
    <td class="nm">${esc(x.n)}${x.note?`<small>${esc(x.note)}</small>`:''}</td>
    <td class="st s-${x.s}">${x.s==='r'?'<span class="dot"></span>':''}${ST[x.s]}${x.chk==='k'?'<small class="s-o">Khớp với bảng</small>':x.chk==='l'?'<small class="s-e">⚠ Lệch so với bảng</small>':''}</td><td class="rw">${x.row||''}</td></tr>`).join('');
  const r=$('#lv .run');if(r&&r.scrollIntoView)r.scrollIntoView({block:'nearest'});
}
function log(t,c){const l=$('#log');l.hidden=false;l.insertAdjacentHTML('beforeend',`<div class="${c}">${esc(t)}</div>`)}

function dlgFields(v){
  $('#ff').innerHTML=S.fields.map((f,i)=>`<label for="f${i}">${esc(f)}</label><input id="f${i}" data-f="${i}" value="${esc(v[f])}">`).join('');
}
function readFields(){
  const v={};document.querySelectorAll('#ff input').forEach(x=>v[S.fields[+x.dataset.f]]=x.value.trim());return v;
}
function openDlg(i){
  edit=i;const p=S.people[i]||{v:{}};
  $('#dt').textContent=i<0?'Thêm người':'Sửa thông tin';
  $('#n').value=p.name||'';$('#l').value=p.link||'';
  dlgFields(p.v);
  $('#del').style.display=i<0?'none':'';
  $('#dlg').showModal();
}
$('#add').onclick=()=>openDlg(-1);
$('#cancel').onclick=()=>$('#dlg').close();
$('#addf').onclick=()=>{
  const name=(prompt('Tên thông tin (giống tên cột trong bảng), ví dụ: Số điện thoại')||'').trim();
  if(!name||S.fields.includes(name))return;
  const v=readFields();S.fields.push(name);save();dlgFields(v);render();
};
$('#fl').onclick=e=>{
  const c=e.target.closest('[data-x]');if(!c)return;
  const f=S.fields[+c.dataset.x];
  if(confirm('Xóa thông tin “'+f+'” khỏi danh sách?')){S.fields.splice(+c.dataset.x,1);save();render()}
};
$('#ok').onclick=()=>{
  const name=$('#n').value.trim();if(!name)return;
  const p={name,link:$('#l').value.trim(),v:readFields(),sel:true};
  if(edit<0)S.people.push(p);else{const o=S.people[edit];S.people[edit]={...o,...p,v:{...o.v,...p.v}}}
  save();render();$('#dlg').close();
};
$('#del').onclick=()=>{if(confirm('Xóa người này?')){S.people.splice(edit,1);save();render();$('#dlg').close()}};
$('#list').onclick=e=>{
  const b=e.target.closest('[data-e]');if(b)openDlg(+b.dataset.e);
  if(e.target.closest('[data-add]'))openDlg(-1);
};
$('#list').onchange=e=>{
  if(!e.target.classList.contains('pick'))return;
  S.people[+e.target.value].sel=e.target.checked;
  e.target.closest('.item').classList.toggle('on',e.target.checked);
  save();count();
};
$('#url').onchange=e=>{S.url=e.target.value.trim();S.ts=0;keep();loadDrive()};
$('#paste').onclick=async()=>{try{$('#link').value=await navigator.clipboard.readText()}catch(e){log('Không đọc được clipboard, hãy dán tay vào ô link.','er')}};

$('#go').onclick=async()=>{
  $('#log').innerHTML='';
  if(!S.url)return log('Chưa có link Apps Script. Mở Cài đặt để dán vào.','er');
  const sel=S.people.filter(p=>p.sel);
  if(!sel.length)return;
  $('#go').disabled=true;
  live=sel.map(p=>({n:p.name,s:'w',row:'',note:''}));
  $('#cmp').hidden=true;$('#live').hidden=false;renderLive();$('#live').scrollIntoView({block:'start'});
  for(let k=0;k<sel.length;k++){
    const p=sel[k],L=live[k];
    L.s='r';renderLive();
    const link=$('#link').value.trim()||p.link||'';
    const m=link.match(/\/d\/([\w-]+)/);
    if(!m){L.s='e';L.note='Chưa có link bảng';renderLive();continue}
    const g=link.match(/[#&?]gid=(\d+)/);
    const fields={};S.fields.forEach(f=>{if(p.v[f])fields[f]=p.v[f]});
    try{
      const r=await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({sheetId:m[1],gid:g?g[1]:'',name:p.name,fields})});
      const j=await r.json();
      if(j.ok){p.link=link;L.s='o';L.row=j.row;
        if(j.miss&&j.miss.length)L.note='Không thấy cột: '+j.miss.join(', ')}
      else{L.s='e';L.note=j.error}
    }catch(e){L.s='e';L.note='Không gọi được Apps Script'}
    renderLive();
  }
  const okL=sel.map((p,k)=>({p,L:live[k]})).filter(x=>x.L.s==='o');
  for(const lk of [...new Set(okL.map(x=>x.p.link))]){
    renderLive(false,'Đang đối chiếu với bảng…');
    const grp=okL.filter(x=>x.p.link===lk),add=(L,t)=>{L.note=[L.note,t].filter(Boolean).join('\n')};
    try{
      const j=await readSheet(lk),map=colMap(j.headers,j.nameCol);
      grp.forEach(x=>{
        const rw=j.rows.find(r=>r.row===x.L.row&&norm(r.name)===norm(x.p.name))||j.rows.find(r=>norm(r.name)===norm(x.p.name));
        if(!rw){x.L.chk='l';add(x.L,'Không thấy tên khi đọc lại');return}
        const c=compare(x.p,rw,map),bad=[...c.diffs,...c.miss];
        x.L.chk=bad.length?'l':'k';
        if(bad.length)add(x.L,bad.join('\n'));
      });
    }catch(e){grp.forEach(x=>add(x.L,'Không đọc lại được để đối chiếu: '+e.message))}
  }
  renderLive(true);
  save();render();
};
$('#ver').textContent='2026-10-21.2';
render();loadDrive();
</script></body></html>
