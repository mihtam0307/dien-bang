<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điền bảng</title>
<style>
:root{color-scheme:light dark;--bg:#fdfcf7;--ink:#1b1b1b;--blue:#1d3fa8;--mu:#666}
@media(prefers-color-scheme:dark){:root{--bg:#15161a;--ink:#eee;--blue:#9db8ff;--mu:#aaa}}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,sans-serif}
h1{margin:0 0 8px;color:var(--blue);font-size:32px}
p{margin:0 0 20px;color:var(--mu)}
button{font:inherit;font-weight:700;padding:12px 18px;border:2px solid var(--blue);border-radius:10px;background:var(--blue);color:var(--bg)}
</style></head><body>
<h1>Không có mạng</h1>
<p>App cần kết nối mạng để mở và tự cập nhật. Bật mạng rồi bấm thử lại.</p>
<button onclick="location.replace('https://mihtam0307.github.io/dien-bang/')">Thử lại</button>
</body></html>
